server {
    listen 80;
    server_name localhost;

    # Proxy requests starting with /api/ to the Backend API container
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Rewrite removes '/api' prefix before sending to FastAPI 
        # (Only if your FastAPI app expects paths WITHOUT /api prefix)
        # rewrite ^/api/(.*) /$1 break; 
    }

    # Proxy all other requests to the Frontend container
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSockets support (for React HMR or Live Updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}