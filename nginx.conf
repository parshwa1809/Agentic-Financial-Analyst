server {
    listen 80;
    server_name localhost;

    # Re-resolve container names through Docker's DNS, so restarting `api` or
    # `frontend` (which can give them a new IP) doesn't leave the gateway on 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $ui_upstream http://frontend:80;

    # Proxy requests starting with /api/ to the Backend API container
    location /api/ {
        proxy_pass $api_upstream;
        # AI council sessions and benchmark runs can take a few minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 20m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Rewrite removes '/api' prefix before sending to FastAPI 
        # (Only if your FastAPI app expects paths WITHOUT /api prefix)
        # rewrite ^/api/(.*) /$1 break; 
    }

    # Proxy all other requests to the Frontend container
    location / {
        proxy_pass $ui_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSockets support (for React HMR or Live Updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}