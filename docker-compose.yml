services:
  # --- INFRASTRUCTURE ---
  redis-queue:
    image: redis:alpine
    container_name: redis-queue
    restart: always
    networks:
      - stock-net

  # --- GATEWAY (NGINX) ---
  gateway:
    image: nginx:alpine
    container_name: stock-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - stock-net

  # --- BACKEND API ---
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: stock-api
    # --reload: code edits under app/ and services/ take effect without restarting the container
    command: sh -c "python scripts/setup_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir services"
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - redis-queue
    ports:
      - "8000:8000"
    expose:
      - "8000"
    environment:
      - TZ=America/New_York
      - OLLAMA_API_URL=http://host.docker.internal:11434/api/generate
      - REDIS_HOST=redis-queue
    networks:
      - stock-net

  # --- FRONTEND UI ---
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "/api"
    container_name: stock-ui
    environment:
      - RUNTIME_API_BASE=/api
    expose:
      - "80"
    networks:
      - stock-net

  # --- BACKGROUND WORKERS ---
  ingestion-price:
    build: .
    container_name: stock-ingestion-price
    command: python -u services/ingestion_price.py
    restart: always
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis-queue]
    environment:
      - TZ=America/New_York
    networks: [stock-net]

  db-writer:
    build: .
    container_name: stock-db-writer
    command: python -u services/db_writer.py
    restart: always
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis-queue]
    environment:
      - TZ=America/New_York
    networks: [stock-net]

  alert-engine:
    build: .
    container_name: stock-alert-engine
    command: python -u services/alert_engine.py
    restart: always
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis-queue]
    environment:
      - TZ=America/New_York
    networks: [stock-net]

  ingestion-fund:
    build: .
    container_name: stock-ingestion-fund
    command: python -u services/ingestion_fund.py
    restart: always
    volumes:
      - .:/app
    env_file: .env
    environment:
      - TZ=America/New_York
    networks: [stock-net]

  news-fetcher:
    build: .
    container_name: stock-news-fetcher
    command: python -u services/news_fetcher.py
    restart: always
    volumes:
      - .:/app
    env_file: .env
    environment:
      - TZ=America/New_York
    networks: [stock-net]

  relationship-agent:
    build: .
    container_name: stock-relationship-agent
    command: python -u services/relationship_agent.py
    restart: always
    volumes:
      - .:/app
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - TZ=America/New_York
    depends_on: [redis-queue]
    networks: [stock-net]
    
  supply-chain-worker:
    build: .
    container_name: stock-supply-chain-worker
    command: python -u -m services.seed_supply_chain
    restart: always
    volumes:
      - .:/app
    env_file: .env
    environment:
      - TZ=America/New_York
      - OLLAMA_API_URL=http://host.docker.internal:11434
    depends_on: 
      - redis-queue
      - api
    networks: 
      - stock-net
      
  council-worker:
    build: .
    container_name: stock-council-worker
    command: python -u -m services.council_worker
    restart: always
    env_file: .env
    volumes:
      - .:/app
    environment:
      - TZ=America/New_York
      - OLLAMA_API_URL=http://host.docker.internal:11434
      - PYTHONPATH=/app
    depends_on: 
      - redis-queue
      - api
    networks: 
      - stock-net

  # RAG: embeds 10-K/20-F text, profiles, news and relationship evidence into TiDB
  # (Ollama `nomic-embed-text`), and indexes any company the chat asks about on demand.
  rag-indexer:
    build: .
    container_name: stock-rag-indexer
    command: python -u -m services.rag_indexer
    restart: always
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis-queue, api]
    environment:
      - TZ=America/New_York
      - PYTHONPATH=/app
      - OLLAMA_API_URL=http://host.docker.internal:11434
    networks: [stock-net]

  # "What changed" alerts: partner moves, new SEC filings, earnings dates, high-risk news
  event-engine:
    build: .
    container_name: stock-event-engine
    command: python -u -m services.event_engine
    restart: always
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis-queue, api]
    environment:
      - TZ=America/New_York
      - PYTHONPATH=/app
    networks: [stock-net]

  # Runs once on every `docker compose up`, fills the price gap since the last stored
  # bar for watchlist tickers (Alpaca historical bars), then exits.
  backfill:
    build: .
    container_name: stock-backfill
    command: sh -c "sleep 20 && python -u -m services.backfill_alpaca --days $${BACKFILL_DAYS:-30} --timeframe 5Min"
    restart: "no"
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis-queue, api]
    environment:
      - TZ=America/New_York
      - PYTHONPATH=/app
    networks: [stock-net]

  maintenance:
    build: .
    container_name: stock-maintenance
    command: python -u services/maintenance_worker.py
    restart: always
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis-queue, api]
    environment:
      - TZ=America/New_York
    networks: [stock-net]

  worker:
    build: .
    container_name: stock-worker
    command: python -u services/rq_worker.py
    restart: always
    env_file: .env
    volumes:
      - .:/app
    depends_on: 
      - redis-queue
      - api
    environment:
      - TZ=America/New_York
      - REDIS_HOST=redis-queue
      - PYTHONPATH=/app
    networks: [stock-net]

networks:
  stock-net:
    driver: bridge